apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  zuri.json: |
    {
      "title": "Zuri Market - Backend",
      "uid": "zuri-backend",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate (requests/sec)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (route) (rate(http_request_duration_seconds_count[1m]))", "legendFormat": "{{route}}"}]
        },
        {
          "id": 2, "type": "timeseries", "title": "Error rate (share of requests)",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "(sum(rate(http_request_duration_seconds_count{status_code=~\"5..\"}[1m])) or vector(0)) / sum(rate(http_request_duration_seconds_count[1m]))", "legendFormat": "5xx server errors"},
            {"refId": "B", "expr": "(sum(rate(http_request_duration_seconds_count{status_code=~\"4..\"}[1m])) or vector(0)) / sum(rate(http_request_duration_seconds_count[1m]))", "legendFormat": "4xx client errors"}
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Latency (seconds)",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "p50 (median)"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
      ]
    }