apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: zuri
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: zuri
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-sa
  namespace: zuri
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuri-viewer
  namespace: zuri
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuri-viewer-binding
  namespace: zuri
subjects:
  - kind: ServiceAccount
    name: viewer-sa
    namespace: zuri
roleRef:
  kind: Role
  name: zuri-viewer
  apiGroup: rbac.authorization.k8s.io