# Run from zuri-platform/, with zuriapp-backend/ and zuriapp-frontend/
# cloned as SIBLING directories (not inside this repo):
#
#   your-workspace/
#   ├── zuriapp-backend/
#   ├── zuriapp-frontend/
#   └── zuri-platform/        <- you run `docker compose up` from here
#
# Copy .env.example to .env in this folder first, then: docker compose up --build

services:
  backend:
    build:
      context: ../zuriapp-backend
      dockerfile: Dockerfile
    container_name: zuri-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      API_SECRET_KEY: ${API_SECRET_KEY}
      STORE_NAME: ${STORE_NAME:-Zuri Market}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/store"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../zuriapp-frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time — see the comment in the frontend Dockerfile.
        VITE_API_URL: http://localhost:5000
    container_name: zuri-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
